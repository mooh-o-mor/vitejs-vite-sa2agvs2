name: DPR IMAP Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install exchangelib
      - name: Test Exchange connection
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
        run: |
          python - <<'EOF'
          import os
          from exchangelib import Credentials, Account, Configuration, DELEGATE
          from exchangelib.protocol import BaseProtocol
          import urllib3
          urllib3.disable_warnings()

          # Отключаем проверку сертификата (для корпоративных серверов)
          BaseProtocol.HTTP_ADAPTER_CLS = \
              type('', (BaseProtocol.HTTP_ADAPTER_CLS,), 
                   {'send': lambda self, *a, **kw: (
                       kw.__setitem__('verify', False) or 
                       super(type(self), self).send(*a, **kw)
                   )})

          user   = os.environ['IMAP_USER']
          passwd = os.environ['IMAP_PASS']
          host   = os.environ['IMAP_HOST']
          folder = os.environ['IMAP_FOLDER']

          print(f"Подключаемся к {host} как {user}")
          creds  = Credentials(user, passwd)
          config = Configuration(
              server=host,
              credentials=creds,
          )
          account = Account(
              user,
              config=config,
              access_type=DELEGATE,
              autodiscover=False,
          )
          print(f"✓ Подключились")
          print(f"\nПапки:")
          for f in account.root.glob('**/*'):
              print(f"  {f.absolute}")
          EOF
